<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔法书 · 互动文字冒险集</title>
<style>
  :root {
    --bg: #14161d;
    --paper: #1b1e28;
    --ink: #cfd3dd;
    --dim: #6b7080;
    --accent: #e8b34b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  h1 {
    font-weight: normal;
    font-size: 36px;
    letter-spacing: .45em;
    margin: 0 0 6px;
    text-indent: .45em; /* 抵消字距让标题真正居中 */
  }
  .sub {
    color: var(--dim); font-size: 14px;
    letter-spacing: .2em; margin-bottom: 56px;
  }
  .pick { color: var(--dim); font-size: 14px; margin-bottom: 18px; letter-spacing: .3em; }
  .card {
    display: block;
    width: min(520px, 100%);
    background: var(--paper);
    border: 1px solid #2b2f3d;
    border-radius: 10px;
    padding: 22px 26px;
    margin-bottom: 18px;
    text-decoration: none;
    color: var(--ink);
    transition: all .2s;
    animation: rise .5s ease both;
  }
  .card:nth-child(odd) { animation-delay: .1s; }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(232,179,75,.18);
    transform: translateY(-2px);
  }
  .card .title {
    font-size: 22px;
    color: var(--accent);
    letter-spacing: .1em;
  }
  .card .tag {
    float: right;
    font-size: 13px;
    color: var(--dim);
    margin-top: 7px;
  }
  .card .desc {
    margin-top: 8px;
    font-size: 15px;
    color: var(--dim);
    line-height: 1.8;
  }
  footer {
    margin-top: 48px;
    color: #3a3f50;
    font-size: 12px;
    letter-spacing: .15em;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<h1>魔法书</h1>
<div class="sub">互动文字冒险集 · 点击文字，进入故事</div>

<div class="pick">—— 选择一个剧本 ——</div>

<a class="card" href="rainy-night.html">
  <span class="tag">推理短篇 · 约 5 分钟</span>
  <div class="title">《雨夜的书房》</div>
  <div class="desc">深夜的一声闷响，反锁的书房，消失的怀表。在文字里搜集线索与道具，戳破证词里站不住脚的那个词。</div>
</a>

<a class="card" href="office.html">
  <span class="tag">职场爽文 · 约 5 分钟</span>
  <div class="title">《整顿职场》</div>
  <div class="desc">凌晨一点，你改完了第八版方案，也攒够了证据。明天的全员大会上，把憋了三年的话连击出去——评级，取决于你的手速。</div>
</a>

<footer>MAGIC BOOK · DEMO</footer>
</body>
</html>
